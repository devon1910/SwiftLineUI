# Local/dev example for the Next public-read service and email worker.
# The current ASP.NET Core API is intentionally not defined here because this
# slice does not add a .NET API Dockerfile. Run it separately or route ingress
# to its existing deployment.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-swiftline}
      POSTGRES_USER: ${POSTGRES_USER:-swiftline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - swiftline-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  web:
    profiles: ["web"]
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      DATABASE_URL: ${DATABASE_URL:-postgresql://swiftline:local-development-only@postgres:5432/swiftline}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      DB_IDLE_TIMEOUT_MS: ${DB_IDLE_TIMEOUT_MS:-30000}
      DB_CONNECTION_TIMEOUT_MS: ${DB_CONNECTION_TIMEOUT_MS:-5000}
      JWT_ISSUER: ${JWT_ISSUER:-swiftline-api}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-swiftline-web}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_SECRET: ${JWT_SECRET:-local-only-secret-at-least-32-characters}
      SWIFTLINE_EVENT_TIME_ZONE: ${SWIFTLINE_EVENT_TIME_ZONE:-Africa/Lagos}
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/ready').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped

  email-worker:
    profiles: ["email-worker"]
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgresql://swiftline:local-development-only@postgres:5432/swiftline}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      DB_IDLE_TIMEOUT_MS: ${DB_IDLE_TIMEOUT_MS:-30000}
      DB_CONNECTION_TIMEOUT_MS: ${DB_CONNECTION_TIMEOUT_MS:-5000}
      EMAIL_WORKER_ID: ${EMAIL_WORKER_ID:-swiftline-email-local}
      EMAIL_WORKER_LOCK_KEY: ${EMAIL_WORKER_LOCK_KEY:-73532428638150609}
      EMAIL_WORKER_BATCH_SIZE: ${EMAIL_WORKER_BATCH_SIZE:-10}
      EMAIL_WORKER_POLL_MS: ${EMAIL_WORKER_POLL_MS:-5000}
      EMAIL_WORKER_STANDBY_MS: ${EMAIL_WORKER_STANDBY_MS:-5000}
      EMAIL_WORKER_ERROR_BACKOFF_MS: ${EMAIL_WORKER_ERROR_BACKOFF_MS:-10000}
      EMAIL_WORKER_LEASE_MS: ${EMAIL_WORKER_LEASE_MS:-30000}
      EMAIL_WORKER_HEARTBEAT_MS: ${EMAIL_WORKER_HEARTBEAT_MS:-10000}
      EMAIL_WORKER_MAX_ATTEMPTS: ${EMAIL_WORKER_MAX_ATTEMPTS:-3}
      EMAIL_WORKER_RETRY_BASE_MS: ${EMAIL_WORKER_RETRY_BASE_MS:-30000}
      EMAIL_WORKER_RETRY_MAX_MS: ${EMAIL_WORKER_RETRY_MAX_MS:-3600000}
      EMAIL_WORKER_RETRY_JITTER_MS: ${EMAIL_WORKER_RETRY_JITTER_MS:-5000}
      WORKER_HEALTH_FILE: ${WORKER_HEALTH_FILE:-/tmp/swiftline-email-worker-health.json}
      WORKER_HEALTH_STALE_MS: ${WORKER_HEALTH_STALE_MS:-90000}
      SWIFTLINE_WORKER_MODULE: ${SWIFTLINE_WORKER_MODULE:-./dist/worker.mjs}
      SWIFTLINE_EMAIL_MAILER_MODULE: ${SWIFTLINE_EMAIL_MAILER_MODULE:-}
      SMTP_HOST: ${SMTP_HOST:-host.docker.internal}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USERNAME: ${SMTP_USERNAME:-local}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-local}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-noreply@example.test}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      replicas: 1
    stop_grace_period: 45s
    restart: unless-stopped

volumes:
  swiftline-postgres-data:
